<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Formulaires EMA ARTBUILD</title>
  </head>
  <body>
    <form name="quote-request" method="POST" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="quote-request" />
      <input name="bot-field" />
      <input name="full_name" />
      <input name="phone" />
      <input name="email" type="email" />
      <input name="city" />
      <input name="project_type" />
      <input name="budget" />
      <textarea name="message"></textarea>
      <input name="locale" />
      <input name="attachment_1" type="file" />
      <input name="attachment_2" type="file" />
      <input name="attachment_3" type="file" />
    </form>
  </body>
</html>
